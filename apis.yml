aid: inertia
name: Inertia
description: 'Inertia is a commercial fusion energy company pursuing laser-driven inertial
  confinement fusion to deliver safe, affordable, grid-scale clean power. Building on the
  December 2022 ignition milestone at the National Ignition Facility (NIF) in Livermore,
  Inertia is developing a modular laser system composed of roughly a thousand smaller, more
  efficient lasers, mass-manufacturing 4.5mm fusion fuel targets for under a dollar each, and
  firing them ten times per second to power a 1.5 gigawatt baseload, dispatchable power plant.
  The company is a deep-tech venture tracked in the API Evangelist network as a portfolio-lead
  stub; it operates a corporate/marketing web presence and publishes no public developer or
  API surface at this time.'
